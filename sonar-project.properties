# SonarQube configuration for Payment Core Service

sonar.projectKey=com.gateway:payment-core-service
sonar.projectName=Payment Core Service
sonar.projectVersion=1.0.0

sonar.sources=src/main/java,src/main/resources
sonar.tests=src/test/java
sonar.sourceEncoding=UTF-8

# Java-specific properties
sonar.java.binaries=target/classes
sonar.java.libraries=target/dependency/*.jar

# Coverage
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.coverage.exclusions=**/*Config.java,**/*Application.java,**/dto/**

# Code quality gates
sonar.qualitygate.wait=true

# Exclusions
sonar.exclusions=**/target/**,**/generated-sources/**,**/generated-test-sources/**

# Specific Java rules
sonar.java.checkstyle.reportPaths=target/checkstyle-result.xml

# Bug detection
sonar.java.spotbugs.reportPaths=target/spotbugsXml.xml

# Issue tracking
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S1602
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.java
