name: Release and Deploy

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ env.RELEASE_VERSION }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Extract version from tag
      run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build Release
      run: |
        ./mvnw clean package -DskipTests \
          -Dproject.version=${{ env.RELEASE_VERSION }}

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ env.RELEASE_VERSION }}
        draft: false
        prerelease: false

    - name: Upload JAR to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./target/gateway-${{ env.RELEASE_VERSION }}.jar
        asset_name: payment-core-service-${{ env.RELEASE_VERSION }}.jar
        asset_content_type: application/java-archive

  docker-push:
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs: release

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ secrets.DOCKER_REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_REGISTRY }}/payment-core-service:${{ needs.release.outputs.version }}
          ${{ secrets.DOCKER_REGISTRY }}/payment-core-service:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  kubernetes-deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [release, docker-push]

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}

    - name: Deploy to Kubernetes
      run: |
        helm upgrade --install payment-core-service ./helm \
          --set image.tag=${{ needs.release.outputs.version }} \
          --set image.repository=${{ secrets.DOCKER_REGISTRY }}/payment-core-service \
          --namespace payment-core \
          --create-namespace \
          -f helm/values-prod.yaml
      env:
        KUBECONFIG: ${{ secrets.KUBECONFIG_CONTENT }}
